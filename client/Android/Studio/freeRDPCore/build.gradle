apply plugin: 'com.android.library'

def skipNativeBuild = project.hasProperty('skipNativeBuild')

// Native libraries differ per variant: the debug variant builds without the
// codec libraries that release and qa enable. Every path that carries them is
// therefore keyed by variant name, because one shared directory lets a variant's
// libraries leak into another variant's APK.
def nativeLibsVariants = ['debug', 'release', 'qa']

// Which variant's cached libraries the skip-native path should package.
// build.sh passes the build mode it was asked for; without it we cannot tell
// debug from release at configuration time, and guessing would silently ship
// the wrong set of libraries.
if (skipNativeBuild && !project.hasProperty('nativeLibsVariant')) {
    throw new GradleException(
        'skipNativeBuild requires -PnativeLibsVariant=<debug|release|qa> so the build packages ' +
        "that variant's native libraries rather than another variant's. build.sh sets this itself.")
}
def nativeLibsVariant = project.findProperty('nativeLibsVariant')
if (nativeLibsVariant != null && !nativeLibsVariants.contains(nativeLibsVariant)) {
    throw new GradleException(
        "Unknown -PnativeLibsVariant=${nativeLibsVariant}; expected one of ${nativeLibsVariants}.")
}

// The skip-native path packages only the selected variant's cache, so a cache
// that was never populated yields an APK with no FreeRDP libraries at all -- a
// build that succeeds and ships something broken. Refuse it here, at configure
// time, rather than let it reach an APK.
if (skipNativeBuild) {
    def cachedVariantDir = file(".native-libs-cache/${nativeLibsVariant}")
    if (fileTree(cachedVariantDir) { include '**/*.so' }.isEmpty()) {
        throw new GradleException(
            "No cached native libraries for variant '${nativeLibsVariant}' under ${cachedVariantDir}, " +
            'so a skip-native build would package an APK without the FreeRDP libraries. ' +
            "Run a full build of this variant first (client/Android/scripts/build.sh --full ${nativeLibsVariant}), " +
            'or omit -PskipNativeBuild.')
    }
}

android {
    compileSdkVersion = rootProject.ext.compileApi
    buildToolsVersion = rootProject.ext.toolsVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minApi
        targetSdkVersion rootProject.ext.targetApi
	ndkVersion = "29.0.13113456"

        if (!skipNativeBuild) {
            ndk {
                //noinspection ChromeOsAbiSupport
                abiFilters "arm64-v8a", "armeabi-v7a", "x86_64", "x86"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
            if (!skipNativeBuild) {
                externalNativeBuild {
                    cmake {
                        arguments "-DWITH_FFMPEG=ON", "-DWITH_OPENH264=ON",
                                  "-DWITH_OPUS=ON",   "-DWITH_WEBP=ON", 
                                  "-DWITH_JPEG=ON",   "-DWITH_PNG=ON", 
                                  "-DWITH_CJSON=ON",  "-DWITH_OPENSSL=ON"

                        abiFilters "arm64-v8a", "armeabi-v7a", "x86_64", "x86"
                    }
                }
            }
        }
        debug {
            jniDebuggable true
            if (!skipNativeBuild) {
                externalNativeBuild {
                    cmake {
                        arguments "-DWITH_FFMPEG=OFF", "-DWITH_OPENH264=OFF",
                                  "-DWITH_OPUS=OFF",   "-DWITH_WEBP=OFF", 
                                  "-DWITH_JPEG=OFF",   "-DWITH_PNG=OFF", 
                                  "-DWITH_CJSON=OFF",  "-DWITH_OPENSSL=ON"

                        abiFilters "arm64-v8a", "armeabi-v7a", "x86_64", "x86"
                    }
                }
            }
        }
        qa {
            jniDebuggable false
            if (!skipNativeBuild) {
                externalNativeBuild {
                    cmake {
                        arguments "-DWITH_FFMPEG=ON", "-DWITH_OPENH264=ON",
                                  "-DWITH_OPUS=ON",   "-DWITH_WEBP=ON",
                                  "-DWITH_JPEG=ON",   "-DWITH_PNG=ON",
                                  "-DWITH_CJSON=ON",  "-DWITH_OPENSSL=ON"

                        abiFilters "arm64-v8a"
                    }
                }
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding true
    }
    if (!skipNativeBuild) {
        externalNativeBuild {
            cmake {
                path file('src/main/cpp/CMakeLists.txt')
            }
        }
    }
    if (skipNativeBuild) {
        // The cache is variant-scoped; src/main/jniLibs is intentionally not a
        // source directory here or anywhere else.
        sourceSets {
            main {
                jniLibs.srcDirs = [file(".native-libs-cache/${nativeLibsVariant}")]
            }
        }
    } else {
        // Native builds get their libraries from the variant-scoped CMake output
        // directory that AGP already collects. Clearing srcDirs also removes the
        // default src/main/jniLibs, so stale libraries left there by an older
        // build of a different variant can never be packaged again.
        sourceSets {
            main {
                jniLibs.srcDirs = []
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.18.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'

    implementation "androidx.room:room-runtime:2.8.4"
    annotationProcessor "androidx.room:room-compiler:2.8.4"

    implementation 'net.zetetic:sqlcipher-android:4.15.0@aar'
    implementation 'androidx.sqlite:sqlite:2.6.2'
}

// Cache the libraries AGP actually packaged for a variant, so a later
// skip-native build of that same variant reproduces it exactly. Reading from
// stripped_native_libs, which is keyed by variant name, is what keeps debug and
// release libraries from being mixed in one cache directory.
nativeLibsVariants.each { variant ->
    def variantCap = variant.capitalize()
    def cacheDir = file(".native-libs-cache/${variant}")

    tasks.register("cacheNativeLibs${variantCap}") {
        outputs.dir cacheDir
        doLast {
            def libRoot = file("${buildDir}/intermediates/stripped_native_libs/${variant}")
            if (!libRoot.exists()) {
                logger.warn("[cacheNativeLibs${variantCap}] No packaged native libs found for " +
                            "variant '${variant}' (${libRoot}); nothing cached.")
                return
            }

            def copied = 0
            fileTree(libRoot) { include '**/lib/*/*.so' }.each { soFile ->
                def dest = new File(cacheDir, "${soFile.parentFile.name}/${soFile.name}")
                dest.parentFile.mkdirs()
                dest.bytes = soFile.bytes
                copied++
            }

            if (copied == 0) {
                logger.warn("[cacheNativeLibs${variantCap}] No .so files found under ${libRoot}.")
            } else {
                logger.lifecycle("[cacheNativeLibs${variantCap}] Cached ${copied} native lib(s) to ${cacheDir}")
            }
        }
    }
}

tasks.matching { it.name ==~ /assemble(Debug|Release|Qa)/ }.configureEach { assembleTask ->
    if (!skipNativeBuild) {
        def variantCap = assembleTask.name.substring('assemble'.length())
        finalizedBy "cacheNativeLibs${variantCap}"
    }
}
